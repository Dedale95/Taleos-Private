name: Publish Public Site

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v4

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: Dedale95/Taleos-Public
          token: ${{ secrets.PUBLIC_REPO_PUSH_TOKEN }}
          path: public-repo

      - name: Sync public files only
        shell: bash
        run: |
          set -euo pipefail

          # ⚠️  Les gros JSON de données brutes (scraped_jobs_live.json, full.json,
          # fichiers individuels par source) sont générés exclusivement par le CI public
          # (update-job-offers.yml). On les PRÉSERVE depuis le dépôt public pour éviter
          # de les écraser avec une version incomplète du dépôt privé.
          # Le summary (scraped_jobs_summary.json) est maintenu manuellement dans le dépôt
          # privé et doit TOUJOURS être propagé — il n'est PAS protégé.
          # On utilise des noms de backup basés sur le chemin complet (/ → _) pour
          # éviter les collisions entre HTML/scraped_jobs_live.json et scraped_jobs_live.json.
          mkdir -p /tmp/public-data
          for f in \
            HTML/scraped_jobs_live.json \
            HTML/scraped_jobs.json \
            HTML/scraped_jobs_full.json \
            scraped_jobs_live.json \
            scraped_jobs.json \
            scraped_jobs.csv; do
            bak_name="$(echo "$f" | tr '/' '_')"
            [ -f "public-repo/$f" ] && cp "public-repo/$f" "/tmp/public-data/${bak_name}.bak" && echo "💾 Sauvegardé: $f" || true
          done

          rm -rf public-repo/HTML
          cp -R HTML public-repo/HTML

          rm -rf public-repo/PYTHON
          cp -R PYTHON public-repo/PYTHON

          cp index.html public-repo/index.html
          cp landing_page_finance.html public-repo/landing_page_finance.html

          # Restauration des fichiers de données protégés depuis le dépôt public
          for f in \
            HTML/scraped_jobs_live.json \
            HTML/scraped_jobs.json \
            HTML/scraped_jobs_full.json \
            scraped_jobs_live.json \
            scraped_jobs.json \
            scraped_jobs.csv; do
            bak_name="$(echo "$f" | tr '/' '_')"
            bak="/tmp/public-data/${bak_name}.bak"
            [ -f "$bak" ] && cp "$bak" "public-repo/$f" && echo "✅ Préservé: $f" || echo "ℹ️  Absent dans le dépôt public: $f"
          done

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to publish."
            exit 0
          fi
          git add .
          git commit -m "chore: publish public site from private source"
          git push origin main

      - name: Build GitHub Pages
        shell: bash
        run: |
          sleep 10
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PUBLIC_REPO_PUSH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Dedale95/Taleos-Public/pages/builds \
            | jq '.status // "triggered"'
