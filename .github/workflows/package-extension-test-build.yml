name: Package Extension Test Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read manifest version
        id: manifest
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          VERSION_NAME=$(node -p "require('./extension/manifest.json').version_name || ''")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        run: |
          mkdir -p build
          cp -R extension build/taleos-extension
          cd build
          zip -qr "taleos-extension-${{ steps.manifest.outputs.version }}.zip" taleos-extension

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taleos-extension-${{ steps.manifest.outputs.version }}
          path: build/taleos-extension-${{ steps.manifest.outputs.version }}.zip
          if-no-files-found: error

      - name: Update version JSON and copy ZIP
        run: |
          set -euo pipefail
          VERSION="${{ steps.manifest.outputs.version }}"
          VERSION_NAME="${{ steps.manifest.outputs.version_name }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DOWNLOAD_URL="https://dedale95.github.io/Taleos-Public/HTML/downloads/taleos-extension-${VERSION}.zip"

          mkdir -p HTML/downloads
          cp "build/taleos-extension-${VERSION}.zip" "HTML/downloads/taleos-extension-${VERSION}.zip"

          # Garder seulement les 3 derniers ZIPs
          cd HTML/downloads
          ls -t taleos-extension-*.zip 2>/dev/null | tail -n +4 | xargs -r rm --
          cd ../..

          # Conserver les release_notes existantes, ajouter download_url
          node -e "
            const fs = require('fs');
            let notes = '';
            try { notes = JSON.parse(fs.readFileSync('HTML/extension-version.json','utf8')).release_notes || ''; } catch(e) {}
            fs.writeFileSync('HTML/extension-version.json', JSON.stringify({
              version: '${VERSION}',
              version_name: '${VERSION_NAME}',
              published_at: '${DATE}',
              release_notes: notes,
              download_url: '${DOWNLOAD_URL}'
            }, null, 2) + '\n');
            console.log('download_url =>', '${DOWNLOAD_URL}');
          "

      - name: Commit and push to private repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HTML/extension-version.json HTML/downloads/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: publish extension v${{ steps.manifest.outputs.version }}"
            git pull --rebase origin main
            git push
          fi

      - name: Sync HTML to Taleos-Public
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${{ secrets.PUBLIC_REPO_PUSH_TOKEN }}@github.com/Dedale95/Taleos-Public.git" public-repo

          # Préserver les fichiers de données (générés par d'autres workflows)
          mkdir -p /tmp/public-data
          for f in HTML/scraped_jobs_live.json HTML/scraped_jobs.json HTML/scraped_jobs_full.json HTML/scraped_jobs_summary.json; do
            bak="$(echo "$f" | tr '/' '_').bak"
            [ -f "public-repo/$f" ] && cp "public-repo/$f" "/tmp/public-data/$bak" || true
          done

          rm -rf public-repo/HTML
          cp -R HTML public-repo/HTML

          # Restaurer les fichiers de données
          for f in HTML/scraped_jobs_live.json HTML/scraped_jobs.json HTML/scraped_jobs_full.json HTML/scraped_jobs_summary.json; do
            bak="$(echo "$f" | tr '/' '_').bak"
            [ -f "/tmp/public-data/$bak" ] && cp "/tmp/public-data/$bak" "public-repo/$f" || true
          done

          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "chore: publish extension v${{ steps.manifest.outputs.version }}"
            git push origin main
          fi

      - name: Build GitHub Pages
        run: |
          sleep 10
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.PUBLIC_REPO_PUSH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Dedale95/Taleos-Public/pages/builds \
            | jq '.status // "triggered"'
